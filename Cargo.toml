[workspace]
resolver = "2"
members = [
    "crates/cover-dsp",
    "crates/cover-media",
    "crates/cover-ml",
    "crates/cover-engine",
    "crates/cover-cli",
    "apps/desktop/src-tauri",
]
# The desktop shell needs webkit2gtk/libsoup system libraries; keep plain
# `cargo build`/`cargo test` usable on machines without them.
default-members = [
    "crates/cover-dsp",
    "crates/cover-media",
    "crates/cover-ml",
    "crates/cover-engine",
    "crates/cover-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/souProjet/cover-studio"
authors = ["Swann"]

[workspace.dependencies]
cover-dsp = { path = "crates/cover-dsp" }
cover-media = { path = "crates/cover-media" }
cover-ml = { path = "crates/cover-ml", default-features = false }
cover-engine = { path = "crates/cover-engine", default-features = false }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs"] }
realfft = "3.5"
rustfft = "6.4"
ebur128 = "0.1"
hound = "3.5"
signalsmith-stretch = "0.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "copy-dylibs", "tls-rustls", "api-31", "preload-dylibs"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
